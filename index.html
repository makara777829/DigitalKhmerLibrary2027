<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Library</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* Custom smooth background gradients */
        body {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(168, 85, 247, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .dark body {
            background-color: #030712;
            background-image: 
                radial-gradient(at 0% 0%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }
    </style>
</head>
<body class="text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">

    <!-- Header Section -->
    <header class="max-w-6xl mx-auto p-4 flex justify-between items-center border-b border-gray-200/60 dark:border-gray-800/60 backdrop-blur-md sticky top-0 bg-white/70 dark:bg-gray-900/70 z-40">
        <div class="flex items-center space-x-2">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-purple-500/30">
                <i class="fa-solid fa-book-open"></i>
            </div>
            <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-purple-600 to-pink-500 bg-clip-text text-transparent">Digital Library</h1>
        </div>
        <div class="flex items-center space-x-3">
            <button id="themeToggle" class="p-2.5 rounded-xl bg-gray-100 dark:bg-gray-800/80 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 transition shadow-sm">
                <i class="fa-solid fa-moon dark:fa-sun"></i>
            </button>
            <button onclick="checkAdminAccess()" class="px-4 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white rounded-xl text-sm font-semibold transition shadow-lg shadow-purple-500/25 flex items-center space-x-2">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span>Upload Photo</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-6xl mx-auto p-4 mt-6">
        <!-- Search Bar -->
        <div class="mb-8 relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search by title or author..." class="w-full pl-11 pr-4 py-3.5 rounded-2xl border border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md focus:outline-none focus:ring-2 focus:ring-purple-500 shadow-sm transition">
        </div>

        <!-- Photo Grid -->
        <div id="photoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20">
            <div class="w-16 h-16 bg-purple-100 dark:bg-purple-900/30 text-purple-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-regular fa-folder-open"></i>
            </div>
            <p class="text-gray-400 text-lg mb-4">No photos found in the library.</p>
            <button id="emptyUploadBtn" onclick="checkAdminAccess()" class="hidden px-5 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-xl font-medium shadow-lg shadow-purple-500/20">Upload the first photo</button>
        </div>
    </main>

    <!-- Upload Modal -->
    <div id="uploadModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-gray-900 rounded-3xl max-w-md w-full p-6 relative shadow-2xl border border-gray-100 dark:border-gray-800">
            <h2 class="text-lg font-bold mb-4 flex items-center space-x-2">
                <i class="fa-solid fa-cloud-arrow-up text-purple-600"></i>
                <span>Upload Multiple Photos</span>
            </h2>
            <form id="uploadForm" onsubmit="handleUpload(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1">Author Name</label>
                    <input type="text" id="authorName" required class="w-full p-3 rounded-xl border border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-800 focus:ring-2 focus:ring-purple-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1">Photo Title / Album Name</label>
                    <input type="text" id="photoTitle" required class="w-full p-3 rounded-xl border border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-800 focus:ring-2 focus:ring-purple-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1">Select Multiple Images</label>
                    <input type="file" id="imageFile" multiple accept="image/*" onchange="previewImages(event)" required class="w-full text-sm file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-purple-50 dark:file:bg-purple-900/40 file:text-purple-600 dark:file:text-purple-300 hover:file:bg-purple-100 cursor-pointer">
                </div>
                <div id="imagePreviewGrid" class="hidden grid grid-cols-3 gap-2 max-h-40 overflow-y-auto"></div>
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" onclick="closeModal()" class="px-4 py-2.5 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-xl text-sm font-medium transition">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-xl text-sm font-semibold shadow-lg shadow-purple-500/25">Upload</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-gray-900 rounded-3xl max-w-3xl w-full max-h-[90vh] flex flex-col overflow-hidden relative shadow-2xl border border-gray-100 dark:border-gray-800">
            <div class="relative bg-black flex-grow flex items-center justify-center min-h-[300px]">
                <button onclick="changeImage(-1)" id="prevImgBtn" class="hidden absolute left-3 text-white bg-black/60 hover:bg-black p-3 rounded-full transition"><i class="fa-solid fa-chevron-left"></i></button>
                <img id="detailImage" src="" onclick="openFullScreenViewer()" class="max-h-[50vh] object-contain cursor-pointer" title="Click for Full Screen">
                <button onclick="changeImage(1)" id="nextImgBtn" class="hidden absolute right-3 text-white bg-black/60 hover:bg-black p-3 rounded-full transition"><i class="fa-solid fa-chevron-right"></i></button>
                <span id="imageCounter" class="hidden absolute bottom-3 right-3 bg-black/70 backdrop-blur-sm text-white text-xs px-2.5 py-1 rounded-lg"></span>
            </div>
            <div class="p-5 flex flex-col flex-grow overflow-y-auto">
                <div class="flex items-center justify-between border-b pb-4 dark:border-gray-800">
                    <div class="flex items-center space-x-3">
                        <div id="detailAvatar" class="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-600 to-pink-500 text-white flex items-center justify-center font-bold text-sm shadow-md"></div>
                        <div>
                            <h4 id="detailAuthor" class="font-semibold text-sm"></h4>
                            <span id="detailDate" class="text-xs text-gray-400"></span>
                        </div>
                    </div>
                    <button onclick="likeCurrentPhoto()" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-xl bg-gray-50 dark:bg-gray-800 hover:bg-red-50 dark:hover:bg-red-950/30 transition">
                        <i id="detailLikeIcon" class="fa-regular fa-heart text-lg text-gray-500"></i>
                        <span id="detailLikesCount" class="text-sm font-medium">0</span>
                    </button>
                </div>
                <h3 id="detailTitle" class="font-bold text-lg mt-4"></h3>
                
                <div class="mt-4 flex-grow">
                    <h5 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Comments</h5>
                    <div id="commentsList" class="space-y-2 max-h-32 overflow-y-auto"></div>
                    <form onsubmit="handleComment(event)" class="mt-3 flex space-x-2">
                        <input type="text" id="commentAuthor" placeholder="Your name..." required class="w-1/3 p-3 text-xs rounded-xl border border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <input type="text" id="commentInput" placeholder="Add a comment..." required class="flex-grow p-3 text-xs rounded-xl border border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <button type="submit" class="px-4 py-2 bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-xs font-semibold rounded-xl shadow-md">Post</button>
                    </form>
                </div>
                <button onclick="closeDetailModal()" class="absolute top-3 right-3 text-white bg-black/60 hover:bg-black w-9 h-9 rounded-full flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
    </div>

    <!-- Full Screen Viewer Modal -->
    <div id="fullScreenViewer" class="hidden fixed inset-0 bg-black flex items-center justify-center z-50">
        <button onclick="closeFullScreenViewer()" class="absolute top-4 right-4 text-white text-2xl p-3 hover:bg-white/10 rounded-full transition"><i class="fa-solid fa-xmark"></i></button>
        <button onclick="changeImage(-1)" id="fsPrevBtn" class="hidden absolute left-4 text-white text-xl bg-white/10 hover:bg-white/20 p-3.5 rounded-full transition"><i class="fa-solid fa-chevron-left"></i></button>
        <img id="fullScreenImage" src="" class="max-w-full max-h-full object-contain">
        <button onclick="changeImage(1)" id="fsNextBtn" class="hidden absolute right-4 text-white text-xl bg-white/10 hover:bg-white/20 p-3.5 rounded-full transition"><i class="fa-solid fa-chevron-right"></i></button>
        <span id="fsCounter" class="hidden absolute bottom-6 text-white text-sm bg-black/70 backdrop-blur-md px-3.5 py-1.5 rounded-xl"></span>
    </div>

    <!-- Core Script -->
    <script>
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        });
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        const SUPABASE_URL = 'https://mivcbuhieuydedcwfebc.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_FXyKPyOBFi1XK-5K0ZSNZQ_VOH_84y5'; 
        const ADMIN_PASSWORD = "224178";

        let supabaseClient = null;
        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (err) {
            console.warn("Supabase initialization skipped.");
        }

        let photos = [];
        let activePhotoId = null;
        let currentImageIndex = 0;
        let searchQuery = '';
        let uploadedImagesBase64 = [];

        function verifyAdmin() {
            if (sessionStorage.getItem('isAdmin') === 'true') return true;
            let password = prompt("Enter admin password:");
            if (password === ADMIN_PASSWORD) {
                sessionStorage.setItem('isAdmin', 'true');
                return true;
            } else if (password !== null) {
                alert("Incorrect password!");
            }
            return false;
        }

        function checkAdminAccess() {
            if (verifyAdmin()) openModal();
        }

        async function fetchPhotos() {
            if (supabaseClient) {
                try {
                    const { data, error } = await supabaseClient
                        .from('DigitalLibrary')
                        .select('*')
                        .order('id', { ascending: false });
                    if (!error && data) {
                        photos = data;
                        renderPhotos();
                        if (activePhotoId !== null) updateDetailModalContent();
                        return;
                    }
                } catch (e) {
                    console.warn("Cloud fetch failed.");
                }
            }
            renderPhotos();
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            renderPhotos();
        }

        function renderPhotos() {
            const grid = document.getElementById('photoGrid');
            const emptyState = document.getElementById('emptyState');
            const emptyUploadBtn = document.getElementById('emptyUploadBtn');
            grid.innerHTML = '';

            const filteredPhotos = photos.filter(photo => 
                photo.title.toLowerCase().includes(searchQuery) || 
                photo.author.toLowerCase().includes(searchQuery)
            );

            if (filteredPhotos.length === 0) {
                emptyState.classList.remove('hidden');
                emptyUploadBtn.classList.toggle('hidden', sessionStorage.getItem('isAdmin') !== 'true');
                return;
            }
            emptyState.classList.add('hidden');

            filteredPhotos.forEach(photo => {
                const card = document.createElement('div');
                card.className = "bg-white/80 dark:bg-gray-900/80 backdrop-blur-md rounded-3xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col group border border-gray-200/80 dark:border-gray-800 relative hover:-translate-y-1";
                
                const photoCountBadge = photo.urls.length > 1 
                    ? `<span class="absolute top-3 right-3 bg-black/70 backdrop-blur-md text-white text-xs px-2.5 py-1 rounded-xl flex items-center space-x-1.5 z-10"><i class="fa-solid fa-layer-group"></i> <span>${photo.urls.length}</span></span>` 
                    : '';

                card.innerHTML = `
                    <div class="relative overflow-hidden cursor-pointer aspect-square bg-gray-50 dark:bg-gray-950 flex items-center justify-center p-2" onclick="openDirectFullScreen(${photo.id}, event)" title="Click to view full screen">
                        ${photoCountBadge}
                        <img src="${photo.urls[0]}" alt="${photo.title}" class="max-w-full max-h-full object-contain group-hover:scale-105 transition duration-500">
                        <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-lg">
                            <i class="fa-solid fa-expand"></i>
                        </div>
                    </div>
                    <div class="p-5 flex flex-col flex-grow justify-between">
                        <div>
                            <h3 class="font-semibold text-gray-900 dark:text-gray-100 truncate cursor-pointer hover:text-purple-600 transition" onclick="openDetailModal(${photo.id})">${photo.title}</h3>
                            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">By ${photo.author}</p>
                        </div>
                        <div class="flex items-center justify-between mt-4 pt-3 border-t border-gray-100 dark:border-gray-800 text-sm">
                            <button onclick="toggleLike(${photo.id}, event)" class="flex items-center space-x-1.5 text-gray-600 dark:text-gray-300 hover:text-red-500 transition">
                                <i class="fa-regular fa-heart text-base text-gray-500"></i>
                                <span>${photo.likes || 0}</span>
                            </button>
                            <div class="flex items-center space-x-3">
                                <button onclick="openDetailModal(${photo.id})" class="flex items-center space-x-1 text-gray-600 dark:text-gray-300 hover:text-purple-500 transition">
                                    <i class="fa-regular fa-comment"></i>
                                    <span>${photo.comments ? photo.comments.length : 0}</span>
                                </button>
                                <button onclick="deletePhoto(${photo.id}, event)" class="text-gray-400 hover:text-red-500 transition" title="Delete Photo">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openDirectFullScreen(id, event) {
            if(event) event.stopPropagation();
            activePhotoId = id;
            currentImageIndex = 0;
            const photo = photos.find(p => p.id === id);
            if (!photo) return;

            const currentUrl = photo.urls[currentImageIndex];
            document.getElementById('fullScreenImage').src = currentUrl;
            
            const hasMultiple = photo.urls.length > 1;
            ['fsPrevBtn', 'fsNextBtn', 'fsCounter'].forEach(elId => {
                document.getElementById(elId).classList.toggle('hidden', !hasMultiple);
            });
            if(hasMultiple) {
                document.getElementById('fsCounter').textContent = `${currentImageIndex + 1} / ${photo.urls.length}`;
            }

            openFullScreenViewer();
        }

        function openModal() { document.getElementById('uploadModal').classList.remove('hidden'); }
        function closeModal() {
            document.getElementById('uploadModal').classList.add('hidden');
            document.getElementById('uploadForm').reset();
            document.getElementById('imagePreviewGrid').classList.add('hidden');
            document.getElementById('imagePreviewGrid').innerHTML = '';
            uploadedImagesBase64 = [];
        }

        function previewImages(event) {
            const files = event.target.files;
            const grid = document.getElementById('imagePreviewGrid');
            grid.innerHTML = '';
            uploadedImagesBase64 = [];

            if (files.length > 0) {
                grid.classList.remove('hidden');
                Array.from(files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        uploadedImagesBase64.push(e.target.result);
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.className = "w-full h-20 object-cover rounded-xl border border-gray-200 dark:border-gray-800";
                        grid.appendChild(img);
                    }
                    reader.readAsDataURL(file);
                });
            }
        }

        async function handleUpload(event) {
            event.preventDefault();
            if (sessionStorage.getItem('isAdmin') !== 'true') return;

            const author = document.getElementById('authorName').value;
            const title = document.getElementById('photoTitle').value;

            const newPost = {
                id: Date.now(),
                title: title,
                author: author,
                urls: uploadedImagesBase64,
                date: "Just now",
                likes: 0,
                comments: []
            };

            if (supabaseClient) {
                try {
                    await supabaseClient.from('DigitalLibrary').insert([newPost]);
                } catch(e) { console.warn("Cloud save failed."); }
            }

            closeModal();
            fetchPhotos();
        }

        async function deletePhoto(id, event) {
            if(event) event.stopPropagation();
            if (!verifyAdmin()) return;

            if (confirm("Delete this post?")) {
                if (supabaseClient) {
                    try { await supabaseClient.from('DigitalLibrary').delete().eq('id', id); } catch(e){}
                }
                closeDetailModal();
                closeFullScreenViewer();
                fetchPhotos();
            }
        }

        async function toggleLike(id, event) {
            if(event) event.stopPropagation();
            const photo = photos.find(p => p.id === id);
            if (!photo) return;

            photo.likes = (photo.likes || 0) + 1;

            if (supabaseClient) {
                try {
                    await supabaseClient.from('DigitalLibrary').update({ likes: photo.likes }).eq('id', id);
                } catch(e) { console.warn("Cloud like failed."); }
            }
            renderPhotos();
            if (activePhotoId === id) updateDetailModalContent();
        }

        function likeCurrentPhoto() { if (activePhotoId) toggleLike(activePhotoId); }

        async function handleComment(event) {
            event.preventDefault();
            if (!activePhotoId) return;

            const authorInput = document.getElementById('commentAuthor');
            const textInput = document.getElementById('commentInput');

            const newComment = {
                author: authorInput.value.trim(),
                text: textInput.value.trim()
            };

            const photo = photos.find(p => p.id === activePhotoId);
            if (!photo) return;

            const updatedComments = photo.comments ? [...photo.comments, newComment] : [newComment];

            if (supabaseClient) {
                try {
                    await supabaseClient.from('DigitalLibrary').update({ comments: updatedComments }).eq('id', activePhotoId);
                } catch(e) { console.warn("Cloud comment failed."); }
            }

            textInput.value = '';
            fetchPhotos();
        }

        function openDetailModal(id) {
            activePhotoId = id;
            currentImageIndex = 0;
            updateDetailModalContent();
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
            activePhotoId = null;
        }

        function changeImage(step) {
            const photo = photos.find(p => p.id === activePhotoId);
            if (!photo) return;
            currentImageIndex = (currentImageIndex + step + photo.urls.length) % photo.urls.length;
            
            const currentUrl = photo.urls[currentImageIndex];
            document.getElementById('fullScreenImage').src = currentUrl;
            if(!document.getElementById('detailModal').classList.contains('hidden')) {
                updateDetailModalContent();
            }

            const hasMultiple = photo.urls.length > 1;
            if(hasMultiple) {
                const counterText = `${currentImageIndex + 1} / ${photo.urls.length}`;
                document.getElementById('imageCounter').textContent = counterText;
                document.getElementById('fsCounter').textContent = counterText;
            }
        }

        function updateDetailModalContent() {
            const photo = photos.find(p => p.id === activePhotoId);
            if (!photo) return;

            const currentUrl = photo.urls[currentImageIndex];
            document.getElementById('detailImage').src = currentUrl;
            document.getElementById('fullScreenImage').src = currentUrl;
            document.getElementById('detailAuthor').textContent = photo.author;
            document.getElementById('detailAvatar').textContent = photo.author.charAt(0).toUpperCase();
            document.getElementById('detailTitle').textContent = photo.title;
            document.getElementById('detailDate').textContent = photo.date || "Recently";
            document.getElementById('detailLikesCount').textContent = photo.likes || 0;
            
            const hasMultiple = photo.urls.length > 1;
            ['prevImgBtn', 'nextImgBtn', 'imageCounter', 'fsPrevBtn', 'fsNextBtn', 'fsCounter'].forEach(id => {
                document.getElementById(id).classList.toggle('hidden', !hasMultiple);
            });
            if(hasMultiple) {
                document.getElementById('imageCounter').textContent = `${currentImageIndex + 1} / ${photo.urls.length}`;
                document.getElementById('fsCounter').textContent = `${currentImageIndex + 1} / ${photo.urls.length}`;
            }

            const commentsList = document.getElementById('commentsList');
            commentsList.innerHTML = (!photo.comments || photo.comments.length === 0) 
                ? `<p class="text-gray-400 text-center py-4 text-xs">No comments yet.</p>`
                : photo.comments.map(c => `
                    <div class="bg-gray-50 dark:bg-gray-800/50 p-2.5 rounded-xl text-xs">
                        <span class="font-bold text-purple-600 dark:text-purple-400 mr-2">${c.author}</span>
                        <span class="text-gray-700 dark:text-gray-300">${c.text}</span>
                    </div>
                `).join('');
        }

        function openFullScreenViewer() { document.getElementById('fullScreenViewer').classList.remove('hidden'); }
        function closeFullScreenViewer() { document.getElementById('fullScreenViewer').classList.add('hidden'); }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { closeFullScreenViewer(); closeDetailModal(); closeModal(); }
        });

        // Initialize App and fetch live posts from cloud database
        fetchPhotos();
        
        // Auto-refresh data every 5 seconds so likes/comments from others appear live
        setInterval(fetchPhotos, 5000);
    </script>
</body>
</html>
